[project]
name = "quiver-check"
version = "0.1.0"
description = "Check a Quiver pack against the pack standard"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.21"]

[project.scripts]
quiver-check = "quiver_check.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-pyyaml", "types-jsonschema"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "S", "BLE", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
